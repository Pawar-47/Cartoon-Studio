name: Cartoon Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        name: Set up uv
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Verify committed dependency lock
        run: |
          uv --version
          uv lock --check
      - name: Install exact locked environment
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check app tests
      - name: Compile Python
        run: uv run --locked python -m compileall -q app
      - name: Test
        run: uv run --locked python -m pytest -q
      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --format requirements.txt --output-file requirements.lock
      - name: Verify runtime lock is committed and current
        run: git diff --exit-code -- requirements.lock
      - name: Export dependency inventory
        run: uv export --locked --all-groups --format cyclonedx1.5 --output-file dependency-sbom.cdx.json
      - name: Package Windows bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path README.md, start.bat, requirements.lock, app, docs -DestinationPath dist/Cartoon-Studio-Windows-Bootstrap.zip -Force
      - name: Smoke-test extracted Windows bootstrap
        run: uv run --locked python tests/smoke_windows_package.py dist/Cartoon-Studio-Windows-Bootstrap.zip
      - name: Upload Windows bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Windows-Bootstrap
          path: dist/Cartoon-Studio-Windows-Bootstrap.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Dependency-SBOM
          path: dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
