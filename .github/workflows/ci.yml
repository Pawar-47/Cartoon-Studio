name: Cartoon Studio CI
on:
  push:
    branches: [main, feature/cartoon-character-foundry]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cartoon-studio-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        name: Set up uv
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Verify committed dependency lock
        run: |
          uv --version
          uv lock --check
      - name: Install exact locked environment
        run: uv sync --locked --group dev
      - name: Fetch pinned Godot 4.7.2 runtime
        run: uv run --locked python scripts/fetch_godot_runtime.py --output-dir build/godot-runtime
      - name: Fetch pinned CC0 facial morph fixture
        run: uv run --locked python scripts/fetch_robot_expressive_fixture.py --output-dir tests/fixtures/third_party
      - name: Lint
        run: uv run --locked ruff check app tests scripts
      - uses: actions/setup-node@v4
        name: Set up Node
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        shell: pwsh
        run: |
          $browserScripts = Get-ChildItem app/static -File | Where-Object { $_.Extension -in @(".js", ".mjs") }
          if (-not $browserScripts) { throw "No first-party browser JavaScript files were found." }
          foreach ($script in $browserScripts) {
            node --experimental-default-type=module --check $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed: $($script.Name)"
            }
          }
      - name: Compile Python
        run: uv run --locked python -m compileall -q app scripts
      - name: Test
        env:
          CARTOON_STUDIO_GODOT_PATH: ${{ github.workspace }}/build/godot-runtime/Godot_v4.7.2-stable_win64.exe
        run: uv run --locked python -m pytest -q
      - name: Install pinned Playwright browser
        if: success()
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Launch Character Studio and verify browser workflows
        if: success()
        env:
          CARTOON_STUDIO_GODOT_PATH: ${{ github.workspace }}/build/godot-runtime/Godot_v4.7.2-stable_win64.exe
        run: node scripts/character_studio_visual_acceptance.mjs
      - name: Upload browser acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-studio-browser-acceptance
          path: build/browser-acceptance/
          if-no-files-found: warn
          retention-days: 14

  blender-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
      - name: Install headless Blender rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libglx-mesa0 libxkbcommon0 libx11-6 libxi6 libxxf86vm1 libxrender1 libxfixes3
      - name: Download pinned Blender 4.5.17 LTS
        env:
          EGL_PLATFORM: surfaceless
        run: |
          curl --fail --location --retry 3 --output blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.17-linux-x64.tar.xz
          mkdir blender-runtime
          tar -xf blender.tar.xz --directory blender-runtime --strip-components=1
          rm blender.tar.xz
          blender-runtime/blender --background --version
      - name: Generate character, world and prop with Blender
        env:
          EGL_PLATFORM: surfaceless
        run: |
          python scripts/verify_blender_assets.py --blender "$PWD/blender-runtime/blender" --output build/blender-assets
      - name: Upload real Blender outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-generated-assets
          path: build/blender-assets/
          if-no-files-found: warn
          retention-days: 14
