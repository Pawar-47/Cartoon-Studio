name: Cartoon Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cartoon-studio-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        name: Set up uv
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Verify committed dependency lock
        run: |
          uv --version
          uv lock --check
      - name: Install exact locked environment
        run: uv sync --locked --group dev
      - name: Fetch pinned Godot 4.7.2 runtime
        run: uv run --locked python scripts/fetch_godot_runtime.py --output-dir build/godot-runtime
      - name: Fetch pinned CC0 facial morph fixture
        run: uv run --locked python scripts/fetch_robot_expressive_fixture.py --output-dir tests/fixtures/third_party
      - name: Lint
        run: uv run --locked ruff check app tests scripts
      - uses: actions/setup-node@v4
        name: Set up Node
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        shell: pwsh
        run: |
          $browserScripts = Get-ChildItem app/static -File | Where-Object { $_.Extension -in @(".js", ".mjs") }
          if (-not $browserScripts) { throw "No first-party browser JavaScript files were found." }
          foreach ($script in $browserScripts) {
            node --experimental-default-type=module --check $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed: $($script.Name)"
            }
          }
      - name: Compile Python
        run: uv run --locked python -m compileall -q app scripts
      - name: Test
        env:
          CARTOON_STUDIO_GODOT_PATH: ${{ github.workspace }}/build/godot-runtime/Godot_v4.7.2-stable_win64.exe
        run: uv run --locked python -m pytest -q
  real-media:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        name: Set up uv
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Install exact locked environment
        run: uv sync --locked --group dev
      - name: Fetch pinned Godot 4.7.2 runtime
        run: uv run --locked python scripts/fetch_godot_runtime.py --output-dir build/godot-runtime
      - name: Fetch pinned LGPL FFmpeg
        run: uv run --locked python scripts/fetch_ffmpeg.py --output-dir build/ffmpeg
      - name: Render an episode with the real Godot and FFmpeg binaries
        env:
          CARTOON_STUDIO_REAL_MEDIA: "1"
          CARTOON_STUDIO_GODOT_PATH: ${{ github.workspace }}/build/godot-runtime/Godot_v4.7.2-stable_win64.exe
          CARTOON_STUDIO_FFMPEG: ${{ github.workspace }}/build/ffmpeg/ffmpeg.exe
          CARTOON_STUDIO_PROOF_DIR: ${{ github.workspace }}/build/render-proof
        run: uv run --locked python -m pytest -q tests/test_render.py::test_real_media_render_produces_a_playable_mp4
      - name: Upload the rendered proof
        uses: actions/upload-artifact@v4
        with:
          name: Real-Media-Episode-Render
          path: |
            build/render-proof/project/renders/episode.mp4
            build/ffmpeg/ffmpeg-runtime-report.json
          if-no-files-found: error
          retention-days: 14
