name: Cartoon Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check app
      - name: Compile Python
        run: python -m compileall -q app
      - name: Test
        run: pytest
      - name: Package Windows bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path README.md, start.bat, requirements.txt, app, docs -DestinationPath dist/Cartoon-Studio-Windows-Bootstrap.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Windows-Bootstrap
          path: dist/Cartoon-Studio-Windows-Bootstrap.zip
          if-no-files-found: error
          retention-days: 14
