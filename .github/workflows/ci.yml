name: Cartoon Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cartoon-studio-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        name: Set up uv
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Verify committed dependency lock
        run: |
          uv --version
          uv lock --check
      - name: Install exact locked environment
        run: uv sync --locked --group dev
      - name: Fetch pinned Godot 4.7.2 runtime
        run: uv run --locked python scripts/fetch_godot_runtime.py --output-dir build/godot-runtime
      - name: Fetch pinned CC0 facial morph fixture
        run: uv run --locked python scripts/fetch_robot_expressive_fixture.py --output-dir tests/fixtures/third_party
      - name: Lint
        run: uv run --locked ruff check app tests scripts/fetch_godot_runtime.py scripts/fetch_robot_expressive_fixture.py scripts/augment_sbom.py
      - uses: actions/setup-node@v4
        name: Set up Node
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --experimental-default-type=module --check app/static/characters.js
      - name: Compile Python
        run: uv run --locked python -m compileall -q app scripts
      - name: Test
        env:
          CARTOON_STUDIO_GODOT_PATH: ${{ github.workspace }}/build/godot-runtime/Godot_v4.7.2-stable_win64.exe
        run: uv run --locked python -m pytest -q
