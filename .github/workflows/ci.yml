name: Cartoon Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        name: Set up uv
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Verify committed dependency lock
        run: |
          uv --version
          uv lock --check
      - name: Install exact locked environment
        run: uv sync --locked --group dev
      - name: Fetch pinned Godot 4.7.2 runtime
        run: uv run --locked python scripts/fetch_godot_runtime.py --output-dir build/godot-runtime
      - name: Lint
        run: uv run --locked ruff check app tests scripts/fetch_godot_runtime.py scripts/augment_sbom.py
      - name: Compile Python
        run: uv run --locked python -m compileall -q app scripts
      - name: Test
        env:
          CARTOON_STUDIO_GODOT_PATH: ${{ github.workspace }}/build/godot-runtime/Godot_v4.7.2-stable_win64.exe
        run: uv run --locked python -m pytest -q
      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --format requirements.txt --output-file requirements.lock
      - name: Verify runtime lock is committed and current
        run: git diff --exit-code -- requirements.lock
      - name: Export dependency inventory
        run: uv export --locked --all-groups --format cyclonedx1.5 --output-file dependency-sbom.cdx.json
      - name: Add Godot runtime to CycloneDX inventory
        run: uv run --locked python scripts/augment_sbom.py --sbom dependency-sbom.cdx.json --manifest engine/godot_runtime.json --runtime-report build/godot-runtime/godot-runtime-report.json
      - name: Add pinned Godot runtime to CycloneDX SBOM
        run: uv run --locked python scripts/add_engine_sbom.py dependency-sbom.cdx.json
      - name: Package Windows bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path README.md, start.bat, requirements.lock, app, docs -DestinationPath dist/Cartoon-Studio-Windows-Bootstrap.zip -Force
      - name: Smoke-test extracted Windows bootstrap
        run: uv run --locked python tests/smoke_windows_package.py dist/Cartoon-Studio-Windows-Bootstrap.zip
      - name: Build self-contained application v1
        shell: pwsh
        run: |
          $staticPath = (Resolve-Path "app/static").Path
          uv run --locked python scripts/set_build_version.py 0.1.0
          uv run --locked pyinstaller --noconfirm --clean --onedir --windowed --name CartoonStudio --specpath build/pyinstaller-v1 --workpath build/pyinstaller-v1/work --distpath dist/installer-v1 --add-data "$staticPath;app/static" --collect-submodules uvicorn app/desktop.py
          $bundle = (Resolve-Path "dist/installer-v1/CartoonStudio").Path
          Copy-Item LICENSES -Destination $bundle -Recurse -Force
          Copy-Item docs/THIRD_PARTY_NOTICES.md, dependency-sbom.cdx.json -Destination $bundle -Force
          $engineRoot = Join-Path $bundle "_internal\engine"
          New-Item -ItemType Directory -Force -Path $engineRoot | Out-Null
          Copy-Item $env:CARTOON_STUDIO_GODOT_PATH (Join-Path $engineRoot "godot.exe") -Force
          Copy-Item "engine/worker" -Destination $engineRoot -Recurse -Force
          $engineNotices = Join-Path $engineRoot "notices"
          New-Item -ItemType Directory -Force -Path $engineNotices | Out-Null
          Copy-Item "third_party/godot-4.7.2/LICENSE.txt", "third_party/godot-4.7.2/COPYRIGHT.txt" -Destination $engineNotices -Force
          $engineRoot = Join-Path $bundle "engine"
          New-Item -ItemType Directory -Force -Path $engineRoot | Out-Null
          Copy-Item build/godot-runtime/Godot_v4.7.2-stable_win64.exe -Destination $engineRoot -Force
          Copy-Item engine/godot_worker -Destination $engineRoot -Recurse -Force
      - name: Build self-contained application v2
        shell: pwsh
        run: |
          $staticPath = (Resolve-Path "app/static").Path
          uv run --locked python scripts/set_build_version.py 0.1.1
          uv run --locked pyinstaller --noconfirm --clean --onedir --windowed --name CartoonStudio --specpath build/pyinstaller-v2 --workpath build/pyinstaller-v2/work --distpath dist/installer-v2 --add-data "$staticPath;app/static" --collect-submodules uvicorn app/desktop.py
          $bundle = (Resolve-Path "dist/installer-v2/CartoonStudio").Path
          Copy-Item LICENSES -Destination $bundle -Recurse -Force
          Copy-Item docs/THIRD_PARTY_NOTICES.md, dependency-sbom.cdx.json -Destination $bundle -Force
          $engineRoot = Join-Path $bundle "engine"
          New-Item -ItemType Directory -Force -Path $engineRoot | Out-Null
          Copy-Item build/godot-runtime/Godot_v4.7.2-stable_win64.exe -Destination $engineRoot -Force
          Copy-Item engine/godot_worker -Destination $engineRoot -Recurse -Force
          uv run --locked python scripts/set_build_version.py 0.1.0
      - name: Install pinned NSIS compiler
        run: choco install nsis --version=3.13.0 --yes --no-progress
      - name: Compile versioned Windows installers
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = Join-Path $env:ProgramFiles "NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) { throw "NSIS 3.13.0 makensis.exe was not found." }
          $distRoot = (Resolve-Path "dist").Path
          $v1Dir = (Resolve-Path "dist/installer-v1/CartoonStudio").Path
          $v2Dir = (Resolve-Path "dist/installer-v2/CartoonStudio").Path
          $v1Out = Join-Path $distRoot "Cartoon-Studio-0.1.0-Setup.exe"
          $v2Out = Join-Path $distRoot "Cartoon-Studio-0.1.1-Setup.exe"
          & $makensis "/DAPP_VERSION=0.1.0" "/DAPP_DIST_DIR=$v1Dir" "/DOUTPUT_FILE=$v1Out" "installer/cartoon-studio.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makensis "/DAPP_VERSION=0.1.1" "/DAPP_DIST_DIR=$v2Dir" "/DOUTPUT_FILE=$v2Out" "installer/cartoon-studio.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test clean install, upgrade, uninstall and reinstall
        run: uv run --locked python tests/smoke_windows_installer.py dist/Cartoon-Studio-0.1.0-Setup.exe dist/Cartoon-Studio-0.1.1-Setup.exe
      - name: Upload Windows bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Windows-Bootstrap
          path: dist/Cartoon-Studio-Windows-Bootstrap.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload self-contained Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Windows-Installer
          path: dist/Cartoon-Studio-0.1.1-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Dependency-SBOM
          path: dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
