name: Retired Branch Cleanup

# Branch deletion is destructive, so it is never automatic. A maintainer must
# dispatch this workflow with the exact branch names to remove. This protects
# long-lived feature/work branches from being deleted by a successful CI run.
on:
  workflow_dispatch:
    inputs:
      branches_to_delete:
        description: "Comma-separated exact branch names to delete. Only these branches will be considered."
        required: true
        type: string
      confirmation:
        description: "Type DELETE LISTED BRANCHES to authorize deletion."
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ inputs.confirmation == 'DELETE LISTED BRANCHES' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete only explicitly listed retired branches
        uses: actions/github-script@v7
        env:
          BRANCHES: ${{ inputs.branches_to_delete }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const protectedBranches = new Set([
              "main",
              "feature/cartoon-character-foundry",
            ]);
            const requested = [
              ...new Set(
                (process.env.BRANCHES || "")
                  .split(",")
                  .map((name) => name.trim())
                  .filter(Boolean)
              ),
            ];

            if (requested.length === 0) {
              core.setFailed("No branch names were supplied; nothing was deleted.");
              return;
            }

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const existing = new Set(branches.map((branch) => branch.name));

            for (const name of requested) {
              if (protectedBranches.has(name)) {
                core.warning(`Refusing to delete protected branch: ${name}`);
                continue;
              }
              if (!existing.has(name)) {
                core.warning(`Branch does not exist; skipped: ${name}`);
                continue;
              }
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${name}`,
              });
              core.info(`Deleted explicitly requested branch: ${name}`);
            }

            core.info("Cleanup finished. main and feature/cartoon-character-foundry were protected.");
