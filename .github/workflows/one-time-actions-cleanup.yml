name: One-time Actions cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-actions-cleanup.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: one-time-actions-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Disable destructive cleanup
        run: echo "Destructive Actions cleanup has been disabled. Existing run history and artifacts must be preserved."
