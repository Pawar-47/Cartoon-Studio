name: Resolve Python dependency lock
on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "app/**"
      - "tests/**"
      - ".github/workflows/resolve-python-lock.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/resolve-python-lock.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Resolve universal cross-platform lock
        run: |
          uv --version
          uv lock
          uv lock --check
      - name: Install exact locked development environment
        run: uv sync --locked --group dev
      - name: Validate source and tests from the lock
        run: |
          uv run --locked ruff check app tests
          uv run --locked python -m compileall -q app
          uv run --locked python -m pytest -q
      - name: Export runtime lock for the Windows bootstrap
        run: uv export --locked --no-dev --format requirements.txt --output-file requirements.lock
      - name: Export dependency inventory
        run: uv export --locked --all-groups --format cyclonedx1.5 --output-file dependency-sbom.cdx.json
      - name: Upload generated lock and dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Python-Lock
          path: |
            uv.lock
            requirements.lock
            dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
