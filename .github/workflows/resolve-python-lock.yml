name: Resolve and commit Python dependency lock
on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "app/**"
      - "tests/**"
      - ".github/workflows/resolve-python-lock.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/resolve-python-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  resolve-and-verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Resolve universal cross-platform lock
        run: |
          uv --version
          uv lock
          uv lock --check
      - name: Install exact locked development environment
        run: uv sync --locked --group dev
      - name: Validate source and tests from the lock
        run: |
          uv run --locked ruff check app tests
          uv run --locked python -m compileall -q app
          uv run --locked python -m pytest -q
      - name: Export runtime lock and dependency inventory
        run: |
          uv export --locked --no-dev --format requirements.txt --output-file requirements.lock
          uv export --locked --all-groups --format cyclonedx1.5 --output-file dependency-sbom.cdx.json
      - name: Commit resolved locks and SBOM
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.lock dependency-sbom.cdx.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Dependency locks are already current."
            exit 0
          }
          git commit -m "build: commit reproducible Python dependency locks"
          git push
      - name: Dispatch locked Windows CI after lock commit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
      - name: Upload dependency lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-Studio-Python-Lock
          path: |
            uv.lock
            requirements.lock
            dependency-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
