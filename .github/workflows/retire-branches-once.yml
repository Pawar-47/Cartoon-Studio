name: Retire all non-main branches (one-time)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE-ALL-NON-MAIN-BRANCHES to proceed
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: one-time-branch-retirement
  cancel-in-progress: false

jobs:
  retire-branches:
    if: github.repository == 'Pawar-47/Cartoon-Studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Archive unique branch tips and delete every non-main branch
        uses: actions/github-script@v7
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (process.env.CONFIRMATION !== 'DELETE-ALL-NON-MAIN-BRANCHES') {
              core.setFailed('Confirmation text did not match. No branches were changed.');
              return;
            }

            const repository = await github.rest.repos.get({ owner, repo });
            if (repository.data.default_branch !== 'main') {
              core.setFailed('Safety stop: default branch is not main.');
              return;
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            if (openPulls.length > 0) {
              core.setFailed('Safety stop: ' + openPulls.length + ' open pull request(s) exist. No branches were changed.');
              return;
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            const targets = branches.filter(branch => branch.name !== 'main');
            core.info('Found ' + branches.length + ' branch(es). main is explicitly excluded. Queued ' + targets.length + ' non-main branch(es).');

            // Build the full plan before deleting anything. Preserve unique branch tips as tags.
            const plan = [];
            for (const branch of targets) {
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: 'main', head: branch.name
              });
              plan.push({
                name: branch.name,
                sha: branch.commit.sha,
                ahead: comparison.data.ahead_by || 0
              });
            }

            const archived = [];
            for (const item of plan.filter(item => item.ahead > 0)) {
              let tag = 'retired-branch-archive/' + item.name;
              try {
                await github.rest.git.createRef({
                  owner, repo, ref: 'refs/tags/' + tag, sha: item.sha
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                tag = 'retired-branch-archive/' + item.name + '-' + item.sha.slice(0, 8);
                await github.rest.git.createRef({
                  owner, repo, ref: 'refs/tags/' + tag, sha: item.sha
                });
              }
              archived.push({ branch: item.name, tag, sha: item.sha });
              core.info('Archived unique tip: ' + item.name + ' -> ' + tag);
            }

            const deleted = [];
            const failures = [];
            for (const item of plan) {
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: 'heads/' + item.name
                });
                deleted.push(item.name);
                core.info('Deleted branch: ' + item.name);
              } catch (error) {
                failures.push({ branch: item.name, message: error.message });
                core.error('Could not delete ' + item.name + ': ' + error.message);
              }
            }

            await core.summary
              .addHeading('Branch retirement results')
              .addRaw('Preserved branch: main\n\nDeleted: ' + deleted.length + ' / ' + plan.length + '\nArchived unique tips: ' + archived.length + '\n\n')
              .addList(deleted.length ? deleted : ['No branches deleted'])
              .addHeading('Archived unique branch tips')
              .addTable([
                [{data: 'Branch', header: true}, {data: 'Archive tag', header: true}],
                ...archived.map(item => [item.branch, item.tag])
              ])
              .write();

            if (failures.length) {
              core.setFailed(failures.length + ' branch(es) could not be deleted. Check branch protection and rerun after resolving failures.');
            }
